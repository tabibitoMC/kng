name: tarjetas-de-red
# Arranca kng (64 bits, texto) con distintos modelos de tarjeta de red de QEMU y comprueba DHCP, ping y DNS.
on: workflow_dispatch
jobs:
  red:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Herramientas
        run: sudo apt-get update && sudo apt-get install -y qemu-system-x86 gcc gcc-multilib binutils python3
      - name: Compilar
        run: make -C kernel64 && make -C kernel
      - name: Probar cada tarjeta
        run: |
          for m in e1000 e1000e igb rtl8139 virtio-net-pci pcnet; do
            QMON=/tmp/qmon.sock KELF=kernel64/kng-kernel64-text.elf python3 tools/ci_drive.py tools/ci/red.txt red-$m.log -- qemu-system-x86_64 -monitor unix:/tmp/qmon.sock,server,nowait -kernel kernel64/kng-kernel64-text.elf -display none -serial stdio -m 1G -nic user,model=$m > /dev/null 2>&1 || true
            if grep -aq "respuesta de 10.0.2.2" red-$m.log; then r=OK; else r=FALLO; fi
            echo "PRUEBA red $m: $r   ($(grep -a -m1 -E 'Red:|tarjeta' red-$m.log | tr -d '\r' | cut -c1-90))"
          done
          for m in e1000e igb; do echo "----- $m"; grep -a -E "Red|ping|dns|IP|ms|tarjeta" red-$m.log | head -12; done
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: red, path: "red-*.log" }
