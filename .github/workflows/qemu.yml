name: arranque-qemu
# Pruebas rapidas en cada push. Las pruebas con Debian real estan en diag.yml (a mano): tools/ci/*.txt
on: [push, workflow_dispatch]
jobs:
  boot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Herramientas
        run: sudo apt-get update && sudo apt-get install -y qemu-system-x86 gcc gcc-multilib binutils grub-pc-bin xorriso mtools python3
      - name: Compilar 32 y 64 bits
        run: make -C kernel && make -C kernel64
      - name: Arranque 32 bits (texto, serie)
        run: |
          timeout 20 qemu-system-i386 -kernel kernel/kng-kernel-text.elf -display none -serial file:boot32.log -m 256M -netdev user,id=n0 -device e1000,netdev=n0 || true
          echo "=== boot32 ==="; cat boot32.log
      - name: Arranque 64 bits (texto, serie)
        run: |
          timeout 20 qemu-system-x86_64 -kernel kernel64/kng-kernel64-text.elf -display none -serial file:boot64.log -m 256M -netdev user,id=n0 -device e1000,netdev=n0 || true
          echo "=== boot64 ==="; cat boot64.log
      - name: Programas Linux en ring 3 (64 bits)
        run: |
          python3 tools/mkrootfs.py rootfs.cpio
          ( sleep 4; echo "programas"; sleep 1; echo "ejecutar /bin/hola"; sleep 3; echo "ejecutar /bin/hola-pie a b"; sleep 4; echo "ejecutar /bin/hola-static x"; sleep 4; echo "ejecutar /bin/hola-dyn y z"; sleep 6; echo "ejecutar /bin/multi-static"; sleep 10; echo "ejecutar /bin/multi-pie"; sleep 10; echo "ejecutar /bin/multi-dyn"; sleep 14; echo "procesos"; sleep 1; echo "uptime"; sleep 2 ) | timeout 100 qemu-system-x86_64 -kernel kernel64/kng-kernel64-text.elf -initrd rootfs.cpio -display none -serial stdio -m 512M > proc64.log 2>&1 || true
          echo "=== proc64 ==="; cat proc64.log
          grep -q "termino con codigo 42" proc64.log && echo "PRUEBA hola (sin libc): OK" || echo "PRUEBA hola: FALLO"
          for t in pie static dyn; do n=$(grep -c "malloc 1 MB ok" proc64.log); done; echo "glibc 'malloc ok' veces: $n (esperado 3)"
          grep -q "argv\[1\]=a" proc64.log && echo "PRUEBA static-pie: OK" || echo "PRUEBA static-pie: FALLO"
          grep -q "argv\[1\]=x" proc64.log && echo "PRUEBA static no-PIE (direccion baja 0x400000): OK" || echo "PRUEBA static no-PIE: FALLO"
          grep -q "argv\[1\]=y" proc64.log && echo "PRUEBA dinamico (ld.so + libc.so.6): OK" || echo "PRUEBA dinamico: FALLO"
          echo "multi 'TODO OK' veces: $(grep -c 'TODO OK' proc64.log) (esperado 3: estatico, static-pie, dinamico)"
      - name: Red, senales y eventos en programas de usuario (64 bits)
        run: |
          python3 tools/mkrootfs.py rootfs.cpio
          python3 tools/ci_server.py 18080 18081 > servidor.log 2>&1 &
          sleep 1
          ( sleep 8; echo "red"; sleep 1; echo "ejecutar /bin/nettest 18080 18081"; sleep 75; echo "procesos"; sleep 2 ) | timeout 140 qemu-system-x86_64 -kernel kernel64/kng-kernel64-text.elf -initrd rootfs.cpio -display none -serial stdio -m 512M -netdev user,id=n0 -device e1000,netdev=n0 > red64.log 2>&1 || true
          echo "=== red64 ==="; cat red64.log
          echo "=== servidor ==="; cat servidor.log
          grep -q "nettest resultado.*TODO OK" red64.log && echo "PRUEBA red+senales+eventos: OK" || echo "PRUEBA red+senales+eventos: FALLO"
      - name: Memoria y archivos en programas de usuario (64 bits)
        run: |
          python3 tools/mkrootfs.py rootfs.cpio
          ( sleep 8; echo "ejecutar /bin/memtest"; sleep 60; echo "procesos"; sleep 2 ) | timeout 110 qemu-system-x86_64 -kernel kernel64/kng-kernel64-text.elf -initrd rootfs.cpio -display none -serial stdio -m 512M > mem64.log 2>&1 || true
          echo "=== mem64 ==="; cat mem64.log
          grep -q "memtest resultado.*TODO OK" mem64.log && echo "PRUEBA memoria+archivos: OK" || echo "PRUEBA memoria+archivos: FALLO"
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: logs, path: "*.log" }
