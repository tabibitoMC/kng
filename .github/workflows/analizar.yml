name: analizar
# Desensambla un binario de un paquete de Debian alrededor de una direccion (para entender un fallo dentro de kng)
on:
  workflow_dispatch:
    inputs:
      paquete: { description: "paquete=version", default: "chromium" }
      binario: { description: "ruta dentro del paquete", default: "usr/lib/chromium/chromium" }
      offset: { description: "desplazamiento hexadecimal en el archivo (rip - base)", default: "0x9a34446" }
jobs:
  a:
    runs-on: ubuntu-latest
    container: debian:bookworm
    steps:
      - uses: actions/checkout@v4
      - run: |
          apt-get update -qq && apt-get install -y -qq binutils python3 > /dev/null
          cd /tmp && apt-get download "${{ inputs.paquete }}" && dpkg-deb -x *.deb x
          B=x/${{ inputs.binario }}; O=${{ inputs.offset }}
          if echo "$O" | grep -q ','; then python3 $GITHUB_WORKSPACE/tools/ci/analizar.py $B $O; exit 0; fi
          # direccion virtual = offset si el binario se enlaza en 0 (PIE)
          S=$(printf '0x%x' $((O-0x200))); E=$(printf '0x%x' $((O+0x40)))
          objdump -d --no-show-raw-insn --start-address=$S --stop-address=$E $B | tail -n 120
          echo "=== saltos al punto del fallo ==="
          T=$(printf '%x' $O); S2=$(printf '0x%x' $((O-0x3000)))
          objdump -d --no-show-raw-insn --start-address=$S2 --stop-address=$E $B > /tmp/d.txt
          grep -n " $T " /tmp/d.txt | head -20
          for n in $(grep -n "j[a-z]* *$T " /tmp/d.txt | cut -d: -f1 | head -8); do echo "--- $n"; sed -n "$((n-25)),$((n+1))p" /tmp/d.txt; done
          echo "=== cadenas cercanas referenciadas ==="
          objdump -d --no-show-raw-insn --start-address=$S --stop-address=$E $B | grep -o '# [0-9a-f]* ' | awk '{print "0x"$2}' | while read a; do
            python3 - "$B" "$a" <<'PY'
          import sys,struct
          b=open(sys.argv[1],'rb').read(); a=int(sys.argv[2],16)
          # buscar la seccion que contiene a (segmentos PT_LOAD)
          phoff=struct.unpack_from('<Q',b,32)[0]; n=struct.unpack_from('<H',b,56)[0]
          for i in range(n):
              t,f,off,va,pa,fs,ms,al=struct.unpack_from('<IIQQQQQQ',b,phoff+i*56)
              if t==1 and va<=a<va+fs:
                  s=b[off+a-va:off+a-va+120].split(b'\0')[0]
                  if len(s)>3 and all(32<=c<127 for c in s): print(hex(a), s.decode())
          PY
          done
