name: prueba-grafica
# Arranca el escritorio de kng en QEMU y lo usa con raton y teclado (tools/ci_gui.py), guardando capturas de pantalla.
on:
  workflow_dispatch:
    inputs:
      guion: { description: "guion de la prueba", default: "tools/ci/gui-archivos.txt" }
jobs:
  gui:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Herramientas
        run: sudo apt-get update && sudo apt-get install -y qemu-system-x86 gcc gcc-multilib binutils python3 grub-pc-bin xorriso mtools cpio
      - name: Compilar
        run: make -C kernel64 && python3 tools/mkrootfs.py --debian kng-extra.cpio 2>/dev/null
      - name: Probar el escritorio
        run: |
          mkdir -p g/boot/grub; cp kernel64/kng-kernel64.elf kng-extra.cpio g/boot/
          printf 'set timeout=0\nmenuentry "kng" {\n  multiboot /boot/kng-kernel64.elf\n  module /boot/kng-extra.cpio\n  boot\n}\n' > g/boot/grub/grub.cfg
          grub-mkrescue -d /usr/lib/grub/i386-pc -o g.iso g 2>&1 | tail -1
          python3 tools/ci_gui.py "${{ inputs.guion }}" -- qemu-system-x86_64 -monitor unix:/tmp/gmon.sock,server,nowait -cdrom g.iso -boot d -vga std -display none -serial stdio -m 2G > gui.log 2>&1 || true
          tail -60 gui.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gui
          path: |
            gui.log
            capturas/*.png
